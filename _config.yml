title: SmileJulie Blog
description: GitHub Pages blog built with Just the Docs
theme: just-the-docs
lang: ko

url: https://smilejulie.github.io
baseurl: /Blog0425
permalink: pretty

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: 맨 위로
footer_content: SmileJulie Blog
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"

aux_links:
  GitHub Repository: https://github.com/SmileJulie/Blog0425

aux_links_new_tab: true

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: default
      nav_exclude: true

plugins:
  - jekyll-feed
